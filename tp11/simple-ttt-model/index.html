<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tres en Raya con TensorFlow.js</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.0.0/dist/tf.min.js"></script>
    <style>
      :root {
        --bg: #f3efe6;
        --card: #fffcf4;
        --ink: #1f1b16;
        --accent: #d35400;
        --accent-soft: #f8d9c5;
        --line: #3d3228;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(
          circle at 15% 15%,
          #fff7e8 0%,
          var(--bg) 55%,
          #ebe3d4 100%
        );
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .app {
        width: min(92vw, 520px);
        background: var(--card);
        border: 3px solid var(--line);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        text-align: center;
      }

      .subtitle {
        margin: 0 0 18px;
        text-align: center;
      }

      #status {
        margin: 0 0 14px;
        font-weight: 700;
        text-align: center;
        min-height: 24px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .cell {
        border: 2px solid var(--line);
        border-radius: 14px;
        background: #fff;
        width: 100%;
        aspect-ratio: 1 / 1;
        font-size: clamp(2rem, 11vw, 3rem);
        font-weight: 800;
        cursor: pointer;
        color: var(--ink);
        transition:
          transform 0.08s ease,
          background-color 0.18s ease;
      }

      .cell:hover:enabled {
        transform: translateY(-2px);
        background: #fff5e7;
      }

      .cell:disabled {
        cursor: not-allowed;
      }

      .controls {
        display: flex;
        justify-content: center;
        margin-top: 16px;
      }

      .btn {
        border: 2px solid var(--line);
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 700;
        padding: 10px 18px;
        cursor: pointer;
      }

      .btn:hover {
        filter: brightness(1.05);
      }

      .legend {
        margin-top: 14px;
        text-align: center;
        font-size: 0.94rem;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Tres en Raya</h1>
      <p class="subtitle">Humano (X) vs Modelo (O)</p>
      <p id="status">Cargando modelo...</p>
      <section class="board" id="board"></section>
      <div class="controls">
        <button class="btn" id="resetBtn" type="button">
          Reiniciar partida
        </button>
      </div>
      <p class="legend">
        Modelo cargado desde <strong>model/ttt_model.json</strong>
      </p>
    </main>

    <script>
      const HUMAN = 1;
      const MODEL = -1;
      const WIN_LINES = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      const statusEl = document.getElementById("status");
      const boardEl = document.getElementById("board");
      const resetBtn = document.getElementById("resetBtn");

      let model = null;
      let board = Array(9).fill(0);
      let gameOver = false;
      let aiThinking = false;

      function renderBoard() {
        boardEl.innerHTML = "";
        for (let i = 0; i < 9; i += 1) {
          const btn = document.createElement("button");
          btn.className = "cell";
          btn.type = "button";
          btn.disabled = board[i] !== 0 || gameOver || aiThinking || !model;
          btn.textContent =
            board[i] === HUMAN ? "X" : board[i] === MODEL ? "O" : "";
          btn.addEventListener("click", () => handleHumanMove(i));
          boardEl.appendChild(btn);
        }
      }

      function findWinner(cells) {
        for (const [a, b, c] of WIN_LINES) {
          const total = cells[a] + cells[b] + cells[c];
          if (total === 3) {
            return HUMAN;
          }
          if (total === -3) {
            return MODEL;
          }
        }
        return 0;
      }

      function isBoardFull(cells) {
        return cells.every((v) => v !== 0);
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function evaluateGame() {
        const winner = findWinner(board);
        if (winner === HUMAN) {
          gameOver = true;
          setStatus("Ganaste. Buen juego.");
          return true;
        }
        if (winner === MODEL) {
          gameOver = true;
          setStatus("El modelo gana esta ronda.");
          return true;
        }
        if (isBoardFull(board)) {
          gameOver = true;
          setStatus("Empate.");
          return true;
        }
        return false;
      }

      function pickBestLegalMove(probs, cells) {
        const legal = [];
        for (let i = 0; i < cells.length; i += 1) {
          if (cells[i] === 0) {
            legal.push(i);
          }
        }
        let bestIndex = legal[0];
        let bestScore = Number.NEGATIVE_INFINITY;
        for (const idx of legal) {
          if (probs[idx] > bestScore) {
            bestScore = probs[idx];
            bestIndex = idx;
          }
        }
        return bestIndex;
      }

      function getModelMove(cells, currentPlayer) {
        return tf.tidy(() => {
          // Canonical board: current player's pieces become +1, rival pieces become -1.
          const canonical = cells.map((v) => v * currentPlayer);
          const input = tf.tensor2d([canonical], [1, 9]);
          const output = model.predict(input);
          const probs = output.dataSync();
          return pickBestLegalMove(probs, cells);
        });
      }

      function handleHumanMove(index) {
        if (!model || gameOver || aiThinking || board[index] !== 0) {
          return;
        }

        board[index] = HUMAN;
        renderBoard();
        if (evaluateGame()) {
          renderBoard();
          return;
        }

        aiThinking = true;
        setStatus("Turno del modelo...");
        renderBoard();

        setTimeout(() => {
          const aiMove = getModelMove(board, MODEL);
          if (board[aiMove] === 0) {
            board[aiMove] = MODEL;
          }
          aiThinking = false;
          const ended = evaluateGame();
          if (!ended) {
            setStatus("Tu turno (X).");
          }
          renderBoard();
        }, 120);
      }

      function resetGame() {
        board = Array(9).fill(0);
        gameOver = false;
        aiThinking = false;
        setStatus(model ? "Tu turno (X)." : "Cargando modelo...");
        renderBoard();
      }

      resetBtn.addEventListener("click", resetGame);

      tf.ready().then(async () => {
        try {
          model = await tf.loadLayersModel("model/ttt_model.json");
          resetGame();
        } catch (error) {
          setStatus(
            "No se pudo cargar el modelo. Revisar ruta y servidor Apache.",
          );
          console.error(error);
          renderBoard();
        }
      });
    </script>
  </body>
</html>
